name: soldisco

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${SOLDISCO_POSTGRES_DB:-soldisco}
      POSTGRES_USER: ${SOLDISCO_POSTGRES_USER:-soldisco}
      POSTGRES_PASSWORD: ${SOLDISCO_POSTGRES_PASSWORD:?set SOLDISCO_POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:${SOLDISCO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - soldisco_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  soldisco_postgres_data:
