name: CI

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOLDISCO_TEST_DATABASE_URL: postgres://soldisco_test:soldisco_test@127.0.0.1:5432/soldisco_test

    services:
      postgres:
        image: postgres:17.10-alpine3.24
        env:
          POSTGRES_DB: soldisco_test
          POSTGRES_USER: soldisco_test
          POSTGRES_PASSWORD: soldisco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soldisco_test -d soldisco_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/web

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Run complete verification
        run: npm run verify
